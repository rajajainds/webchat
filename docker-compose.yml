# LOCAL DEVELOPMENT: databases only. Run backend + frontend on your machine.
#   docker compose up -d
#   cd backend && uvicorn app.main:app --reload
#   cd frontend && npm install && npm run dev
services:
  postgres:
    image: postgres:17-alpine          # same major version as RDS
    environment:
      POSTGRES_USER: webchat
      POSTGRES_PASSWORD: webchat
      POSTGRES_DB: webchat
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  mongo:
    image: mongo:8.0
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]
volumes:
  pgdata:
  mongodata:
