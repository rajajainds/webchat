# PRODUCTION on one EC2 server: Postgres + backend + Nginx (Nginx also serves the React build).
# MongoDB is MongoDB Atlas (set MONGO_URL in backend/.env).
# Needs deploy/.env with:  POSTGRES_PASSWORD=<same password used in DATABASE_URL>
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: webchat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: webchat
    volumes: [pgdata:/var/lib/postgresql/data]   # data survives container restarts
    # no "ports": only the backend container can reach it
  backend:
    build: ../backend
    env_file: ../backend/.env          # DATABASE_URL host is "postgres" (the service name above)
    restart: unless-stopped
    depends_on: [postgres]
    expose: ["8000"]                   # not published: only Nginx can reach it
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on: [backend]
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro    # React build (npm run build)
      - /etc/letsencrypt:/etc/letsencrypt:ro         # HTTPS certificate
volumes:
  pgdata:
